services:
  backend:
    build: ./backend
    environment:
      ENV: dev                 # prod refuses to start with DEMO_OTP or PAYMENT_SIMULATOR on
      DEMO_OTP: "1"            # shows the OTP in the UI; set to 0 once an SMS gateway sends real codes
      PAYMENT_SIMULATOR: "1"   # marks checkouts paid without a gateway; set to 0 once Zarinpal/IDPay is wired
      SECURE_COOKIE: "0"       # 1 behind HTTPS (prod default)
    expose:
      - "8000"                 # reachable only from the frontend container; the browser talks to /api through Next
    volumes:
      - db:/data
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3017:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  db:
